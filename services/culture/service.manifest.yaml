id: culture
name: Tunisia Cultural Intelligence Network
ministry: Culture
description: Cultural assets, immersive access and a creative economy that can be measured.
mission: Make culture an infrastructure with a state — conserved, visited,
  funded — rather than a calendar of events.
capabilities:
  - Condition and use of every cultural asset.
  - Digitised works and immersive access.
  - Creative activity, audience and revenue.
modules:
  - id: tunisia-cultural-digital-twin
    name: Tunisia Cultural Digital Twin
    purpose: Condition and use of every cultural asset.
  - id: immersive-tunisia
    name: Immersive Tunisia
    purpose: Digitised works and immersive access.
  - id: creative-economy-ai-network
    name: Creative Economy AI Network
    purpose: Creative activity, audience and revenue.
owns:
  - CulturalAssetRef
  - CreativeWorkRef
  - CulturalEventRef
apis:
  - method: GET
    path: /api/culture/assets
    summary: health Cultural asset
    module: platform
  - method: GET
    path: /api/culture/assets
    summary: list Cultural asset
    module: tunisia-cultural-digital-twin
  - method: GET
    path: /api/culture/assets/:id
    summary: get Cultural asset
    module: tunisia-cultural-digital-twin
  - method: POST
    path: /api/culture/assets
    summary: create Cultural asset
    module: tunisia-cultural-digital-twin
  - method: POST
    path: /api/culture/events/plan
    summary: Plan a cultural event and warn the ministries whose load it will change.
    module: creative-economy-ai-network
  - method: GET
    path: /api/culture/assets/condition
    summary: Cultural asset condition by governorate.
    module: tunisia-cultural-digital-twin
  - method: GET
    path: /api/culture/assets
    summary: signals Cultural asset
    module: platform
  - method: GET
    path: /api/culture/assets
    summary: twins Cultural asset
    module: platform
  - method: GET
    path: /api/culture/signals
    summary: Signals received from other ministries.
    module: platform
  - method: GET
    path: /api/culture/twins
    summary: Digital twins maintained here.
    module: platform
  - method: GET
    path: /api/culture/dependencies
    summary: Live status of outgoing integrations.
    module: platform
publishes:
  - event: culture.asset-condition.updated.v1
    summary: Condition of a cultural asset changed.
  - event: culture.event.scheduled.v1
    summary: A cultural event was scheduled — mobility, safety and tourism plan
      against it.
  - event: culture.creative-economy.updated.v1
    summary: Creative activity and revenue for a governorate.
consumes:
  - event: iot.sensor.observation.v1
    from: digital-nervous-system
    criticality: critical
    reason: Humidity, temperature and vibration observations are the asset condition
      twin.
  - event: environment.air-quality.updated.v1
    from: environment
    criticality: critical
    reason: Pollution is the slow destroyer of monuments and open-air sites.
  - event: environment.climate-risk.updated.v1
    from: environment
    criticality: critical
    reason: Flood and humidity risk set the conservation queue.
  - event: tourism.visitor-flow.updated.v1
    from: tourism
    criticality: critical
    reason: Visitor load is the main controllable pressure on cultural assets.
  - event: tourism.site-pressure.detected.v1
    from: tourism
    criticality: critical
    reason: Over-capacity means restricting access, which Culture decides.
  - event: heritage.site-condition.updated.v1
    from: religious-heritage
    criticality: critical
    reason: Shared assets must not carry two contradictory condition records.
  - event: infrastructure.failure.predicted.v1
    from: infrastructure
    criticality: critical
    reason: Museums and monuments are buildings with predictable failure modes.
  - event: transport.mobility-demand.updated.v1
    from: mobility-logistics
    criticality: normal
    reason: Event planning needs the corridor picture before the date is fixed.
  - event: education.program.updated.v1
    from: education
    criticality: normal
    reason: Cultural education programmes and the asset register are planned together.
  - event: skills.gap.detected.v1
    from: skills-opportunity
    criticality: normal
    reason: Conservation and creative trades are a measurable national skill gap.
  - event: treasury.funding.approved.v1
    from: treasury
    criticality: critical
    reason: Restoration and creative programmes exist once funded.
  - event: emergency.incident.created.v1
    from: safety-emergency
    criticality: critical
    reason: Fire or flood at a cultural asset is irreversible; response must be
      immediate.
  - event: research.finding.released.v1
    from: research
    criticality: normal
    reason: Conservation science results change how assets are treated.
  - event: global.opportunity.published.v1
    from: global-tunisia
    criticality: normal
    reason: Diaspora audiences and funding are part of the creative economy.
depends_on:
  - digital-nervous-system
  - education
  - environment
  - global-tunisia
  - infrastructure
  - mobility-logistics
  - religious-heritage
  - research
  - safety-emergency
  - skills-opportunity
  - tourism
  - treasury
consumed_by:
  - education
  - environment
  - global-tunisia
  - land
  - life-care
  - mobility-logistics
  - national-digital-twin
  - religious-heritage
  - research
  - safety-emergency
  - talent
  - tourism
related_services:
  - digital-nervous-system
  - education
  - environment
  - global-tunisia
  - infrastructure
  - land
  - life-care
  - mobility-logistics
  - national-digital-twin
  - religious-heritage
  - research
  - safety-emergency
  - skills-opportunity
  - talent
  - tourism
  - treasury
ai_capabilities:
  - condition forecasting
  - audience recommendation
  - archive summarisation
iot_capabilities:
  - humidity
  - temperature
  - occupancy
  - vibration
digital_twin_capabilities:
  - cultural asset twin
  - creative economy twin
data:
  synthetic_only: true
  owns_collection: assets
  seeded_rows: 38
