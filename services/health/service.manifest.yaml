  - education
  - environment
  - food-water
  - global-tunisia
  - industrial-energy
  - infrastructure
  - justice
  - life-care
  - mobility-logistics
  - national-digital-twin
  - research
  - resilience
  - safety-emergency
  - skills-opportunity
  - smart-trade
  - social-mobility
  - talent
  - tourism
  - treasury
ai_capabilities:
  - triage
  - epidemic signal detection
  - capacity forecasting
iot_capabilities:
  - wearable heart rate
  - air quality
  - occupancy
  - temperature
digital_twin_capabilities:
  - hospital twin
  - cohort health twin
data:
  synthetic_only: true
  owns_collection: facilities
  seeded_rows: 34
