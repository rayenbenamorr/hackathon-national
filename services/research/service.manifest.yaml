id: research
name: Tunisia Research Brain
ministry: Higher Education & Research
description: National research as an addressable capability, and a path from
  result to deployment.
mission: Connect what laboratories can already do to what ministries are
  currently blocked on — the gap between the two is where most public value is
  lost.
capabilities:
  - Projects, disciplines, maturity, findings.
  - Real-territory pilots with instrumented outcomes.
  - Matches a research result to the ministry that needs it.
modules:
  - id: national-research-brain
    name: National Research Brain
    purpose: Projects, disciplines, maturity, findings.
  - id: living-lab-tunisia
    name: Living Lab Tunisia
    purpose: Real-territory pilots with instrumented outcomes.
  - id: ai-innovation-transfer-engine
    name: AI Innovation Transfer Engine
    purpose: Matches a research result to the ministry that needs it.
owns:
  - ResearchProjectRef
  - PatentRef
  - LivingLabRef
apis:
  - method: GET
    path: /api/research/projects
    summary: health Research project
    module: platform
  - method: GET
    path: /api/research/projects
    summary: list Research project
    module: national-research-brain
  - method: GET
    path: /api/research/projects/:id
    summary: get Research project
    module: national-research-brain
  - method: POST
    path: /api/research/projects
    summary: create Research project
    module: national-research-brain
  - method: POST
    path: /api/research/transfer/match
    summary: Find the research result that answers a stated ministry need.
    module: ai-innovation-transfer-engine
  - method: GET
    path: /api/research/capability
    summary: Research capability by discipline.
    module: living-lab-tunisia
  - method: GET
    path: /api/research/projects
    summary: signals Research project
    module: platform
  - method: GET
    path: /api/research/projects
    summary: twins Research project
    module: platform
  - method: GET
    path: /api/research/signals
    summary: Signals received from other ministries.
    module: platform
  - method: GET
    path: /api/research/twins
    summary: Digital twins maintained here.
    module: platform
  - method: GET
    path: /api/research/dependencies
    summary: Live status of outgoing integrations.
    module: platform
publishes:
  - event: research.project.published.v1
    summary: A research project was registered or updated.
  - event: research.finding.released.v1
    summary: A usable result was released.
  - event: research.transfer.matched.v1
    summary: A result was matched to a ministry need.
consumes:
  - event: skills.gap.detected.v1
    from: skills-opportunity
    criticality: normal
    reason: A persistent national gap is a research and training agenda.
  - event: agriculture.water-shortage.predicted.v1
    from: food-water
    criticality: critical
    reason: Water scarcity is the most funded applied research question in the country.
  - event: environment.climate-risk.updated.v1
    from: environment
    criticality: critical
    reason: Climate projections set the agenda of the living labs.
  - event: health.epidemic-signal.detected.v1
    from: health
    criticality: critical
    reason: An epidemic signal is a research trigger with a deadline.
  - event: industry.symbiosis.matched.v1
    from: industrial-energy
    criticality: normal
    reason: Symbiosis matches are process research made concrete.
  - event: infrastructure.failure.predicted.v1
    from: infrastructure
    criticality: normal
    reason: Materials and structural research follows real failure modes.
  - event: education.program.updated.v1
    from: education
    criticality: normal
    reason: Programmes and research capability must stay in the same graph.
  - event: treasury.funding.approved.v1
    from: treasury
    criticality: critical
    reason: A research project without approved funding is a proposal.
  - event: twin.scenario.completed.v1
    from: national-digital-twin
    criticality: normal
    reason: Scenario gaps are exactly where research is missing.
  - event: land.site-suitability.scored.v1
    from: land
    criticality: normal
    reason: Living lab sites are chosen by land suitability.
  - event: trade.supply-risk.flagged.v1
    from: smart-trade
    criticality: normal
    reason: A supply dependency at risk is a substitution research problem.
  - event: global.diaspora-signal.updated.v1
    from: global-tunisia
    criticality: normal
    reason: Diaspora researchers are a large part of national research capability.
  - event: culture.asset-condition.updated.v1
    from: culture
    criticality: normal
    reason: Conservation science is driven by measured asset degradation.
  - event: talent.injury-risk.flagged.v1
    from: talent
    criticality: normal
    reason: Sports science is applied physiology research with a live dataset.
depends_on:
  - culture
  - education
  - environment
  - food-water
  - global-tunisia
  - health
  - industrial-energy
  - infrastructure
  - land
  - national-digital-twin
  - skills-opportunity
  - smart-trade
  - talent
  - treasury
consumed_by:
  - culture
  - digital-nervous-system
  - education
  - environment
  - food-water
  - global-tunisia
  - industrial-energy
  - justice
  - religious-heritage
  - skills-opportunity
  - smart-trade
  - treasury
related_services:
  - culture
  - digital-nervous-system
  - education
  - environment
  - food-water
  - global-tunisia
  - health
  - industrial-energy
  - infrastructure
  - justice
  - land
  - national-digital-twin
  - religious-heritage
  - skills-opportunity
  - smart-trade
  - talent
  - treasury
ai_capabilities:
  - RAG over publications
  - need-to-capability matching
  - maturity scoring
iot_capabilities:
  - living lab instrumentation
digital_twin_capabilities:
  - project twin
  - living lab twin
data:
  synthetic_only: true
  owns_collection: projects
  seeded_rows: 38
